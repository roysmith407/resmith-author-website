name = "resmith-author-website"
main = "src/worker.js"
compatibility_date = "2026-10-30"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "resmith-books"
database_id = "265733c9-760a-4b9d-a301-30cb22e76de8"
migrations_dir = "migrations"

